<!doctype html>
<!-- Acceptance check for the layout/rhythm tokens added in 0.9.0 (see the CHANGELOG
     entry). Not shipped: `files` in package.json excludes scripts/. `pnpm check:scale`
     already guards the SOURCE; this page proves the COMPUTED result — that the grid
     law survives the cascade, that a rail marker lands dead-centre on its rail, that
     the density knob actually retunes 22 recipes, and that <nes-toc> and a docs-shell
     grid switch shape at the same width (they used to disagree between 1180 and 1184px).
       python3 -m http.server 8000   ->   /scripts/scale-check.html
-->
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>scale check</title>
<link rel="stylesheet" href="../all.css">
<script type="module" src="../elements.js"></script>
<style>
  #r { font: 12px/1.7 monospace; color: var(--cyan); white-space: pre-wrap; padding: 8px }
  .fail { color: var(--crit) }
  /* D · the density knob: one line, every --pad-snug recipe inside gets tighter */
  #dense { --pad-snug: var(--sp-1) var(--sp-2) }
  /* G · retheming focus is meant to be one declaration */
  #ring { --ring-c: var(--cyan) }
  /* inline-block + pre, or the rect is the CONTAINER's width and the digit-width
     assertion below passes without measuring anything */
  #mono, #sans { display: inline-block; white-space: pre; font-size: 16px }
  #mono { font-family: var(--font-mono) }
  #sans { font-family: var(--font-body) }
  iframe { border: 0 }
</style>
</head>
<body>
<div id="r">…</div>

<!-- B · recipes whose padding comes from the box-padding roles -->
<div class="card" id="card"><span class="badge" id="badge">BADGE</span></div>
<span class="chip" id="chip">chip</span>
<div id="dense"><span class="chip" id="chip2">chip</span></div>

<!-- G · type, weight, layers, focus, switch -->
<span id="mono">0123456789</span><span id="sans">0123456789</span>
<label class="switch-wrap"><input type="checkbox" class="switch" id="sw" checked></label>
<div id="ring"><button class="btn" id="ringbtn">focus me</button></div>

<!-- C · the three rail+marker modules -->
<ol class="timeline" id="tl"><li>one</li><li>two</li></ol>
<div class="trace" id="tr"><div class="trace-step" data-state="done">step</div></div>

<script type="module">
const out = [];
const render = () => { document.getElementById("r").textContent = out.join("\n"); };
// render as we go: a hang then shows exactly which assertion it died after
const ok = (cond, label, extra = "") => {
  out.push(`${cond ? "PASS" : "FAIL"}  ${label}${extra ? " · " + extra : ""}`);
  render();
};
// a harness that dies silently is worse than a failing one
addEventListener("error", (e) => { document.getElementById("r").textContent = `THREW: ${e.message}\n${out.join("\n")}`; });
addEventListener("unhandledrejection", (e) => { document.getElementById("r").textContent = `REJECTED: ${e.reason}\n${out.join("\n")}`; });
const V = (n, el = document.documentElement) => getComputedStyle(el).getPropertyValue(n).trim();
const PX = (v) => Number.parseFloat(v);
await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));

/* ---- A · every new token resolves ---- */
const NEW = ["--sp-hair", "--pad-tight", "--pad-snug", "--pad-box", "--chip-py", "--chip-px",
  "--atom-py", "--atom-px", "--dot", "--pip", "--bp-sm", "--bp-lg", "--bp-xl",
  "--gutter", "--chrome-h", "--nav-w", "--rail-w"];
const missing = NEW.filter((t) => !V(t));
ok(missing.length === 0, `A · all ${NEW.length} new tokens resolve`, missing.join(" ") || "none missing");
ok(V("--chrome-h") === V("--ctrl-h-xl"), "A · --chrome-h is exactly one xl control", `${V("--chrome-h")} = ${V("--ctrl-h-xl")}`);
ok(PX(V("--sp-hair")) === PX(V("--bw-2")), "A · the seam matches the small border weight", V("--sp-hair"));
const bps = ["--bp-sm", "--bp-lg", "--bp-xl"].map((n) => V(n));
ok(bps.every((v) => v.endsWith("rem")), "A · every breakpoint is rem (scales with font size)", bps.join(" "));

/* ---- B · the grid law survives the cascade (computed, not source) ---- */
const grid = (el, props, step) => {
  const cs = getComputedStyle(el);
  const bad = props.flatMap((p) => {
    const v = PX(cs[p]);
    return Number.isFinite(v) && v % step !== 0 ? [`${p}=${cs[p]}`] : [];
  });
  return bad;
};
const PADS = ["paddingBlockStart", "paddingBlockEnd", "paddingInlineStart", "paddingInlineEnd"];
for (const [id, label] of [["card", ".card"], ["chip", ".chip"], ["badge", ".badge"]]) {
  const bad = grid(document.getElementById(id), PADS, 4);
  const cs = getComputedStyle(document.getElementById(id));
  ok(bad.length === 0, `B · ${label} pads on the 4px grid`, bad.join(" ") || `${cs.paddingBlockStart} ${cs.paddingInlineStart}`);
}
const dot = PX(V("--dot")), pip = PX(V("--pip"));
ok(dot % 2 === 0 && pip % 2 === 0, "B · marker sizes on the 2px grid", `dot=${dot} pip=${pip}`);

/* ---- C · a marker lands dead-centre on its 2px rail ---- */
const bw2 = PX(V("--bw-2"));
const off = (sel) => PX(getComputedStyle(document.querySelector(sel), "::before").insetInlineStart);
const tlOff = off("#tl > li");
const trOff = off("#tr > .trace-step");
ok(tlOff === -(dot + bw2) / 2, "C · timeline dot centred on the rail", `${tlOff}px, want ${-(dot + bw2) / 2}px`);
ok(trOff === -(pip + bw2) / 2, "C · trace marker centred on the rail", `${trOff}px, want ${-(pip + bw2) / 2}px`);
ok(tlOff !== trOff, "C · a 10px dot and a 12px marker are NOT offset the same", `${tlOff} vs ${trOff}`);

/* ---- D · the density knob ---- */
const base = getComputedStyle(document.getElementById("chip")).paddingBlockStart;
const tight = getComputedStyle(document.getElementById("chip2")).paddingBlockStart;
ok(PX(tight) === 4 && PX(base) === 8, "D · one --pad-snug override retunes the recipe", `${base} → ${tight}`);

/* ---- E · the boundary. A media query needs a real viewport, and only an iframe
   has one — a 1184px-wide <div> is still laid out against the window. srcdoc keeps
   the parent's origin and base URL, so ../all.css and ../elements.js resolve. ---- */
const frame = (srcdoc, w) =>
  new Promise((res) => {
    const f = document.createElement("iframe");
    f.style.cssText = `inline-size:${w}px;block-size:220px`;
    f.addEventListener("load", () => setTimeout(() => res(f), 220), { once: true });
    f.srcdoc = srcdoc;
    document.body.append(f);
  });
const SHELL = (query) => `<link rel="stylesheet" href="../all.css">
<script type="module" src="../elements.js"><\/script>
<style>body{margin:0}
 .app{display:grid;grid-template-columns:240px minmax(0,1fr) 224px}
 @media ${query} { .app{grid-template-columns:240px minmax(0,1fr)} }</style>
<div class="app"><i></i><main id="m"><h2>a</h2><h2>b</h2></main><nes-toc target="#m" rail-at="74rem"></nes-toc></div>`;
const shape = async (query, w) => {
  const f = await frame(SHELL(query), w);
  const d = f.contentDocument;
  const three = getComputedStyle(d.querySelector(".app")).gridTemplateColumns.split(" ").length === 3;
  return { three, rail: d.querySelector("nes-toc").hasAttribute("data-rail") };
};
// 1184px is the one width where `max-width: 74rem` and `min-width: 74rem` BOTH match
const oldWay = await shape("(max-width: 74rem)", 1184);
ok(oldWay.three === false && oldWay.rail === true,
  "E · CONTROL: max-width:74rem disagrees with the rail at exactly 1184px",
  `narrow shell (cols3=${oldWay.three}) + rail component (rail=${oldWay.rail})`);
const newWay = await shape("(width < 74rem)", 1184);
ok(newWay.three === newWay.rail, "E · (width < 74rem) agrees at 1184px", `cols3=${newWay.three} rail=${newWay.rail}`);
const below = await shape("(width < 74rem)", 1180);
ok(below.three === below.rail, "E · …and at 1180px", `cols3=${below.three} rail=${below.rail}`);

/* The real docs shell at each interesting width. A FRESH iframe per width, not one
   iframe resized: reading state mid-resize can swallow the pending MediaQueryList
   `change` in headless Chrome, which then shows up as a fake failure here. The live
   resize path gets its own assertion below, with no reads in between. */
let lastDocs = null;
const docsAt = async (w) => {
  const f = document.createElement("iframe");
  f.style.cssText = `inline-size:${w}px;block-size:600px`;
  // listener BEFORE src/append, or a cached load can beat it and hang the await
  const loaded = new Promise((r) => f.addEventListener("load", r, { once: true }));
  f.src = "../docs.html";
  document.body.append(f);
  await loaded;
  await new Promise((r) => setTimeout(r, 250));
  const d = (lastDocs = f).contentDocument;
  return {
    three: getComputedStyle(d.querySelector(".app")).gridTemplateColumns.split(" ").length === 3,
    rail: d.querySelector("nes-toc").hasAttribute("data-rail"),
  };
};
const disagree = [];
for (const w of [1180, 1184]) {
  const s = await docsAt(w);
  if (s.three !== s.rail) disagree.push(`${w}px(cols3=${s.three},rail=${s.rail})`);
}
ok(disagree.length === 0, "E · docs shell and <nes-toc> agree at 1180 and 1184", disagree.join(" ") || "both widths agree");

/* A live resize across the boundary is NOT asserted here: under
   --virtual-time-budget, requestAnimationFrame does not advance predictably, so
   waiting for the MediaQueryList `change` is flaky in headless. Verified out of
   band instead — resizing 1160 → 1184 delivers exactly one change event within
   100ms and lands in the rail shape. Reading `_mq.matches` mid-resize can swallow
   that event, so don't add a probe that does. */

/* ---- F · the shell metrics reach the docs page ---- */
const ld = lastDocs.contentDocument;
ok(V("--chrome-h", ld.documentElement) === V("--top-h", ld.documentElement),
  "F · docs --top-h now comes from --chrome-h", V("--top-h", ld.documentElement));
const contentPad = getComputedStyle(ld.querySelector(".content")).paddingInlineStart;
ok(PX(contentPad) % 4 === 0, "F · the page gutter lands on the grid", contentPad);

/* ---- G · type scale: every rung an integer px, so no text-sized box lands on a
   half pixel (there is no blur or radius in this system to hide that behind) ---- */
const FS = ["--fs-label", "--fs-chip", "--fs-h3", "--fs-body", "--fs-lead", "--fs-h2", "--fs-h1"];
const probe = document.createElement("span");
document.body.append(probe);
const resolved = FS.map((t) => {
  probe.style.fontSize = `var(${t})`;
  return [t, PX(getComputedStyle(probe).fontSize)];
});
probe.remove();
const fractional = resolved.filter(([, v]) => !Number.isInteger(v));
ok(fractional.length === 0, "G · every type rung is an integer px",
  fractional.map(([t, v]) => `${t}=${v}`).join(" ") || resolved.map(([, v]) => v).join(" · "));
ok(resolved.every(([, v], i) => i === 0 || v > resolved[i - 1][1]), "G · the scale is monotonic",
  resolved.map(([t, v]) => `${t.slice(5)}:${v}`).join(" "));
ok(V("--fs-code").endsWith("em"), "G · inline-code rung is relative, not fixed", V("--fs-code"));

/* ---- G · weight: only the three the faces actually ship ---- */
const FW = ["--fw-regular", "--fw-medium", "--fw-bold"].map((t) => V(t));
ok(FW.join(" ") === "400 450 700", "G · weight scale = the shipped axis stops", FW.join(" "));
// If --font-mono is ever re-themed to a proportional face, its digits stop being
// equal width and every live counter in the library starts jittering. That is the
// only reason the library can skip font-variant-numeric — so assert the premise.
await document.fonts.ready;
const width = (el, text) => { el.textContent = text; return el.getBoundingClientRect().width; };
const mono = document.getElementById("mono"), sans = document.getElementById("sans");
const mSpread = Math.max(width(mono, "1111111111"), width(mono, "0000000000"), width(mono, "4444444444")) -
  Math.min(width(mono, "1111111111"), width(mono, "0000000000"), width(mono, "4444444444"));
const sSpread = Math.max(width(sans, "1111111111"), width(sans, "0000000000")) -
  Math.min(width(sans, "1111111111"), width(sans, "0000000000"));
ok(mSpread === 0, "G · mono digits are equal width (why no tabular-nums is needed)", `spread ${mSpread.toFixed(2)}px`);
ok(sSpread > 4, "G · sans digits are NOT — a changing number there needs mono or tabular-nums", `spread ${sSpread.toFixed(2)}px`);

/* The bundled faces are SUBSETS, and this is a Vietnamese library — a subset built
   with the wrong unicode-range drops the diacritics and nothing announces it: the
   browser silently falls back and the text still reads. The mono face is fixed
   pitch at 0.6em, so any glyph that came from a fallback instead measures something
   else. That makes the advance a decisive test for "this glyph is really ours". */
const EM = 100;
mono.style.fontSize = `${EM}px`;
const VIET = "ừẫợỗệẹđĐăâêôơưẤỀỘỚỰẽỹọụịỳ₫";
const offGrid = [...VIET].filter((c) => Math.abs(width(mono, c) - EM * 0.6) > 0.01);
ok(offGrid.length === 0, "G · every Vietnamese glyph comes from the mono subset, not a fallback",
  offGrid.length ? `fell back: ${offGrid.join(" ")}` : `${VIET.length} glyphs all 0.6em`);
mono.style.fontSize = "";
sans.style.fontSize = `${EM}px`;
const sansViet = width(sans, VIET);
sans.style.fontFamily = "serif";
const sansFallback = width(sans, VIET);
sans.style.fontFamily = "";
sans.style.fontSize = "";
ok(document.fonts.check(`${EM}px "NES Sans"`) && Math.abs(sansViet - sansFallback) > 1,
  "G · and the sans subset carries them too", `NES Sans ${sansViet.toFixed(1)}px vs serif ${sansFallback.toFixed(1)}px`);

/* ---- G · the large-screen type step. An iframe has its own viewport, which is the
   only way to evaluate a min-width rule from inside one page. ---- */
const TYPE_PAGE = `<link rel="stylesheet" href="../all.css">
<body style="margin:0"><span id="p">x</span></body>`;
const rungsAt = async (w) => {
  const f = await frame(TYPE_PAGE, w);
  return f.contentWindow.eval(`
    (() => {
      const el = document.getElementById("p"), out = [];
      for (const t of ["--fs-label","--fs-chip","--fs-h3","--fs-body","--fs-lead","--fs-h2","--fs-h1"]) {
        el.style.fontSize = "var(" + t + ")";
        out.push(Number.parseFloat(getComputedStyle(el).fontSize));
      }
      return out;
    })()`);
};
const small = await rungsAt(1599);
const large = await rungsAt(1600);
ok(small.join(" ") === "9 11 12 14 16 17 26", "G · below --bp-2xl the scale is unchanged", small.join(" · "));
ok(large.join(" ") === "10 12 13 16 18 20 32", "G · at --bp-2xl every rung steps up one notch", large.join(" · "));
ok(large.every((v) => Number.isInteger(v)) && large.every((v, i) => i === 0 || v >= large[i - 1]),
  "G · the stepped scale is still integer px and monotonic", large.join(" · "));

/* ---- G · the stacking ladder is a ladder ---- */
const Z = ["--z-raised", "--z-pop", "--z-sticky", "--z-drawer", "--z-chrome", "--z-overlay", "--z-top"].map((t) => Number(V(t)));
ok(Z.every((v, i) => i === 0 || v > Z[i - 1]), "G · --z-* is strictly increasing", Z.join(" < "));

/* ---- G · focus ring rethemes from one declaration. NOT via .focus(): script
   focus does not satisfy the :focus-visible heuristic, so the computed outline is
   whatever the unfocused state is — the assertion would pass or fail by accident.
   Check the two halves that actually make the retheme work instead. ---- */
const ringVar = getComputedStyle(document.getElementById("ringbtn")).getPropertyValue("--ring-c").trim();
ok(/33e0e0|51,\s*224,\s*224|var\(--cyan\)/.test(ringVar), "G · --ring-c override reaches the control", ringVar);
// all.css is three @imports, and every file wraps its rules in @layer — so the
// focus rule sits two container levels down. Walk, do not flatMap one level.
const walk = (rules, hit = []) => {
  for (const r of rules || []) {
    if (r.selectorText?.includes(":focus-visible") && r.style?.outline) hit.push(r);
    if (r.cssRules) walk(r.cssRules, hit);
    else if (r.styleSheet) {
      try {
        walk(r.styleSheet.cssRules, hit);
      } catch {}
    }
  }
  return hit;
};
const focusRule = walk([...document.styleSheets].flatMap((sh) => {
  try {
    return [...sh.cssRules];
  } catch {
    return [];
  }
}))[0];
ok(/var\(--ring-w\)/.test(focusRule?.style.outline || "") && /var\(--ring-c\)/.test(focusRule?.style.outline || ""),
  "G · and the focus rule is written in those tokens", focusRule?.style.outline || "(no rule found)");

/* ---- G · the switch thumb travels to a symmetric stop ---- */
const sw = document.getElementById("sw");
const cs = getComputedStyle(sw), after = getComputedStyle(sw, "::after");
const tx = Number((after.transform.match(/matrix\(1, 0, 0, 1, ([-\d.]+)/) || [])[1] || NaN);
const inner = PX(cs.inlineSize) - 2 * PX(cs.borderInlineStartWidth);
const want = inner - PX(after.inlineSize) - 2 * PX(after.insetInlineStart);
ok(tx === want, "G · checked thumb stops as far from the right edge as it started from the left",
  `travel ${tx}px, symmetric ${want}px`);

const fails = out.filter((l) => l.startsWith("FAIL")).length;
out.unshift(`${out.length - fails}/${out.length} PASS${fails ? `  —  ${fails} FAIL` : ""}\n`);
document.getElementById("r").textContent = out.join("\n");
document.title = "DONE";
</script>
</body>
</html>
