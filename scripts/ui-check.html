<!doctype html>
<!-- Fixtures for `pnpm check:ui` — one instance of each stateful component whose
     behaviour cannot be seen in CSS. The assertions live in scripts/ui-check.mjs
     and run in REAL time over CDP, not under --virtual-time-budget: a <dialog>
     `close` event is never delivered while virtual time fast-forwards, so a
     promise-based confirm would "fail" for a reason that has nothing to do with
     the library. Not shipped: `files` in package.json excludes scripts/. -->
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ui check</title>
<link rel="stylesheet" href="../all.css">
<script type="module" src="../elements.js"></script>
<style>#o { font: 12px/1.6 monospace; color: var(--cyan); white-space: pre-wrap; padding: var(--sp-2) }</style>
</head>
<body>
<div id="o">…</div>

<div class="toolbar" style="margin-block: var(--sp-3)">
  <button class="btn sm">Run</button><button class="btn sm outline">Stop</button>
  <i class="toolbar-sep"></i><button class="btn sm ghost">Logs</button>
  <span class="toolbar-gap"></span><button class="btn sm">Deploy</button>
</div>

<nes-popover placement="bottom-start" id="pop">
  <button class="btn" id="popbtn">Filters</button>
  <div class="popover">
    <b class="popover-title">Filter</b>
    <label class="check"><input type="checkbox" class="checkbox"> Only failing</label>
  </div>
</nes-popover>

<!-- the six items an integrator filed against 0.14.0 -->
<article class="prose" id="pr" style="inline-size:900px">
  <p>Claim<a class="cite" id="cite-in" href="#s1">1</a>.</p>
  <nes-walkthrough id="wt"><section data-title="A">x</section><section data-title="B">y</section></nes-walkthrough>
</article>
<a class="cite" id="cite-out" href="#s1">1</a>
<div class="palette"><div class="palette-list" id="pl"><button class="result">a</button></div></div>
<!-- a div, not a <dialog>: the confirm assertions above look for the one dialog.modal confirmDialog() makes -->
<div class="modal" id="mod"><div class="palette"><div class="palette-list" id="pl-modal"><button class="result">a</button></div></div></div>
<dialog class="drawer" id="dr-end"><b>END</b></dialog>
<dialog class="drawer start" id="dr-start"><b>START</b></dialog>
<nes-zoom id="zoomer" aria-label="d" style="display:block;inline-size:300px;block-size:150px"><svg viewBox="0 0 100 50" width="300" height="150" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="50" fill="#0d0d2b"/></svg></nes-zoom>

<!-- the four items filed against 0.15.0 -->
<div style="inline-size:320px" id="narrow">
  <article class="prose">
    <img id="wide" width="1400" height="300" alt=""
         src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==">
  </article>
</div>

<div style="inline-size:360px"><table class="table" id="grid">
  <tbody><tr>
    <td id="g1">A1</td>
    <td id="g2">short</td>
    <td id="g3">a cell long enough that it has to wrap onto several lines and make this row much taller than one line of text</td>
  </tr></tbody>
</table></div>

<div class="callout" id="co-default">d</div>
<div class="callout tip" id="co-tip">t</div>
<div class="callout memo" id="co-memo">m</div>
<div class="callout quest" id="co-quest">q</div>
<div class="callout info" id="co-info">i</div>
<div class="callout warn" id="co-warn">w</div>
<div class="callout gotcha" id="co-gotcha">g</div>
<div class="callout warn" id="co-off" style="--mark:none">off</div>

<span class="pbar" id="pb-out" style="inline-size:200px;--fill:50%"><i id="fi-out"></i></span>
<span class="pbar" id="pb-in" style="inline-size:200px"><i id="fi-in" style="--fill:50%"></i></span>
<span class="pbar" id="pb-none" style="inline-size:200px"><i id="fi-none"></i></span>

<nes-split at="40" min="15" id="sp" style="block-size:10rem;margin-block:var(--sp-3)">
  <div style="padding:var(--sp-2)">left</div><div style="padding:var(--sp-2)">right</div>
</nes-split>

<script type="module">
import { confirmDialog, toast } from "../elements.js";

const R=[]; const ok=(c,l,e="")=>{R.push(`${c?"PASS":"FAIL"}  ${l}${e?" · "+e:""}`);document.getElementById("o").textContent=R.join("\n");};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const within=(p,ms,l)=>Promise.race([p,wait(ms).then(()=>`TIMEOUT after ${ms}ms (${l})`)]);
addEventListener("error",e=>{document.getElementById("o").textContent=`THREW: ${e.message} @ ${e.lineno}\n`+R.join("\n")});
addEventListener("unhandledrejection",e=>{document.getElementById("o").textContent=`REJECTED: ${e.reason}\n`+R.join("\n")});
await customElements.whenDefined("nes-split"); await wait(120);

/* ---- toast ---- */
const t1 = toast("<img src=x onerror='window.__pwned=1'>");
await wait(30);
ok(!window.__pwned && t1.textContent.includes("<img"), "toast · text by default, markup not parsed", JSON.stringify(t1.textContent.slice(0,18)));
const t2 = toast("<b>bold</b>", { html: true });
ok(!!t2.querySelector("b"), "toast · html:true opts in");
const t3 = toast("Sticky", { timeout: 0 });
ok(!!t3.querySelector(".toast-x"), "toast · a sticky toast always has a dismiss");
ok(!t3.querySelector(".toast-bar"), "toast · and no countdown bar");
let undone = 0;
const t4 = toast("Deleted", { action: { label: "UNDO", onClick: () => undone++ } });
t4.querySelector(".toast-act").click();
await wait(260);
ok(undone === 1 && !t4.isConnected, "toast · action runs and dismisses", `undone=${undone}`);
const t5 = toast("Hover me", { timeout: 1000 });
t5.dispatchEvent(new PointerEvent("pointerenter", { bubbles: true }));
await wait(1200);
ok(t5.isConnected && "paused" in t5.dataset, "toast · paused by a pointer outlives its timeout (WCAG 2.2.1)");
t5.dispatchEvent(new PointerEvent("pointerleave", { bubbles: true }));
await wait(1400);
ok(!t5.isConnected, "toast · and leaves once the pointer does");
const host = document.querySelector(".toast-host");
const crit = toast("Boom", { accent: "crit", sound: false });
ok(host.getAttribute("aria-live") === "assertive", "toast · an error flips the live region to assertive");
await wait(200);
ok(host.getAttribute("aria-live") === "polite", "toast · and it goes back to polite");
for (let i = 0; i < 9; i++) toast(`spam ${i}`, { sound: false });
ok(host.children.length <= 4, "toast · a runaway loop is capped", `${host.children.length} visible`);
[...host.children].forEach(c => c.dismiss?.());
await wait(260);
// swipe
const t6 = toast("Swipe", { timeout: 0, sound: false });
const pe=(ty,x)=>t6.dispatchEvent(new PointerEvent(ty,{pointerId:1,pointerType:"touch",clientX:x,bubbles:true}));
pe("pointerdown",200); pe("pointermove",120);
const moved = t6.style.transform;
pe("pointerup",20);
await wait(300);
ok(moved.includes("-80") && !t6.isConnected, "toast · a swipe follows the finger and dismisses", moved);

/* ---- popover ---- */
const pop = document.getElementById("pop"), panel = pop.querySelector(".popover");
ok(panel.getAttribute("popover") === "auto", "popover · uses the native popover API (top layer)");
document.getElementById("popbtn").click();
await wait(120);
const pr = panel.getBoundingClientRect(), br = document.getElementById("popbtn").getBoundingClientRect();
ok(pop.open && pr.top >= br.bottom, "popover · opens below its trigger", `panel.top=${Math.round(pr.top)} btn.bottom=${Math.round(br.bottom)}`);
ok(document.getElementById("popbtn").getAttribute("aria-expanded") === "true", "popover · trigger announces expanded");
ok(pr.left >= 0 && pr.right <= innerWidth, "popover · shifted to stay on screen", `${Math.round(pr.left)}…${Math.round(pr.right)} of ${innerWidth}`);
pop.hide(); await wait(60);
ok(!pop.open && document.getElementById("popbtn").getAttribute("aria-expanded") === "false", "popover · hide() closes and resets the trigger");

/* ---- split ---- */
const sp = document.getElementById("sp"), bar = sp.querySelector(".split-bar");
ok(!!bar && bar.getAttribute("role") === "separator", "split · divider is a real separator");
ok(sp.at === 40 && bar.getAttribute("aria-valuenow") === "40", "split · honours at=", `${sp.at}`);
let ev = null; sp.addEventListener("nes:resize", e => ev = e.detail);
bar.dispatchEvent(new KeyboardEvent("keydown", { key: "ArrowRight", bubbles: true }));
ok(sp.at === 42 && ev?.at === 42, "split · arrow moves it 2% and emits nes:resize", `${sp.at}`);
bar.dispatchEvent(new KeyboardEvent("keydown", { key: "Home", bubbles: true }));
ok(sp.at === 15, "split · Home goes to min", `${sp.at}`);
sp.at = 999;
ok(sp.at === 85, "split · clamped by min from both ends", `${sp.at}`);
ok(getComputedStyle(sp).gridTemplateColumns.split(" ").length === 3, "split · grid is pane · bar · pane");

/* ---- confirm ---- */
const p1 = confirmDialog({ title: "Delete branch?", body: "Cannot be undone." });
await wait(120);
const dlg = document.querySelector("dialog.modal");
ok(!!dlg?.open, "confirm · opens a modal <dialog>");
ok(document.activeElement === dlg.querySelector(".btn.outline"), "confirm · focus starts on Cancel, so Enter is never destructive");
dlg.querySelector(".btn:not(.outline)").click();
ok((await within(p1,2000,"confirm true")) === true, "confirm · resolves true on confirm");
const p2 = confirmDialog({ title: "Again?" });
await wait(120);
const d2 = document.querySelector("dialog.modal");
d2.dispatchEvent(new MouseEvent("click", { bubbles: true }));
ok((await within(p2,2000,"backdrop")) === false, "confirm · a backdrop click resolves false");
const p3 = confirmDialog({ title: "Esc?" });
await wait(80);
document.querySelector("dialog.modal").close();
ok((await within(p3,2000,"esc")) === false, "confirm · Esc/close resolves false");
ok(!document.querySelector("dialog.modal"), "confirm · cleans up after itself");

/* ---- the six items filed against 0.14.0 ---- */
const ink = (el) => {
  const rg = document.createRange(); rg.selectNodeContents(el);
  const i = rg.getBoundingClientRect(), b = el.getBoundingClientRect();
  return +((i.top + i.height / 2) - (b.top + b.height / 2)).toFixed(2);
};
const cs = (id, p) => getComputedStyle(document.getElementById(id))[p];

// 1 · the citation digit is centred by its INK, not by its line box
const off = Math.abs(ink(document.getElementById("cite-out")));
ok(CSS.supports("text-box-trim", "trim-both") ? off < 0.5 : off < 1.2,
  "cite · the digit is centred on its ink", `${off}px off centre`);

// 2 · .prose a must not repaint the library's own citation chip
ok(cs("cite-in", "color") === cs("cite-out", "color") &&
   cs("cite-in", "textDecorationLine") === cs("cite-out", "textDecorationLine"),
  "cite · looks the same inside .prose as outside", `${cs("cite-in","color")} / ${cs("cite-in","textDecorationLine")}`);

// 3 · the zoom hint exists only while a gesture does
const z = document.getElementById("zoomer"), stage = z.querySelector(".zoom-stage"), view = z.querySelector(".zoom-view");
const atRest = getComputedStyle(stage).willChange;
view.dispatchEvent(new WheelEvent("wheel", { deltaY: -1, bubbles: true, cancelable: true }));
const during = getComputedStyle(stage).willChange;
await wait(400);
ok(atRest === "auto" && during === "transform" && getComputedStyle(stage).willChange === "auto",
  "zoom · will-change is a gesture hint, not a permanent layer", `${atRest} → ${during} → ${getComputedStyle(stage).willChange}`);

// 4 · a width-driven element in prose is not squeezed to the reading measure
ok(cs("wt", "maxInlineSize") === "none", "prose · <nes-walkthrough> opts out of the measure", cs("wt", "maxInlineSize"));

// 5 · the palette's height cap belongs to the overlay, not the list
const inPage = cs("pl", "maxBlockSize"), inModal = cs("pl-modal", "maxBlockSize");
ok(inPage === "none" && inModal !== "none", "palette · capped in an overlay, free in a page", `page ${inPage} · modal ${inModal}`);

// 6 · a drawer on a real <dialog> opens on the side it says
const dEnd = document.getElementById("dr-end"), dStart = document.getElementById("dr-start");
dEnd.showModal(); await wait(450);
const re = dEnd.getBoundingClientRect(); dEnd.close();
dStart.showModal(); await wait(450);
const rs = dStart.getBoundingClientRect(); dStart.close();
/* a fixed element's containing block is the viewport WITHOUT the scrollbar, which is
   documentElement.clientWidth — innerWidth counts the scrollbar and reads 10px wide */
const vw = document.documentElement.clientWidth;
ok(Math.round(re.right) === vw && Math.round(rs.left) === 0,
  "drawer · end hugs the end edge, .start hugs the start",
  `end ${Math.round(re.left)}–${Math.round(re.right)} · start ${Math.round(rs.left)}–${Math.round(rs.right)} of ${vw}`);

/* ---- the four items filed against 0.15.0 ---- */
await new Promise(r => requestAnimationFrame(r));

// 1 · media escapes the reading measure, never the container
const wide = document.getElementById("wide");
ok(cs("wide", "maxInlineSize") === "100%", "prose · media keeps the container cap", cs("wide", "maxInlineSize"));
ok(Math.round(wide.getBoundingClientRect().width) <= 320,
  "prose · a 1400px-wide image fits a 320px container",
  `${Math.round(wide.getBoundingClientRect().width)}px of 320`);

// 2 · a data grid is read across, so a wrapped row still shares one top edge
const top = (id) => { const rg = document.createRange(); rg.selectNodeContents(document.getElementById(id)); return rg.getBoundingClientRect().top; };
const tops = ["g1","g2","g3"].map(top);
const spread = +(Math.max(...tops) - Math.min(...tops)).toFixed(1);
ok(cs("g1", "verticalAlign") === "top" && spread < 1,
  "table · a wrapped row keeps every cell on one top edge",
  `${cs("g1","verticalAlign")} · ${spread}px spread over ${Math.round(document.getElementById("g1").getBoundingClientRect().height)}px`);

// 3 · WCAG 1.4.1 — a callout kind is not carried by hue alone
const KINDS = ["default","tip","memo","quest","info","warn","gotcha"];
const marks = KINDS.map(k => getComputedStyle(document.getElementById("co-" + k), "::before").content);
ok(new Set(marks).size === KINDS.length && !marks.includes("none"),
  "callout · every kind carries a distinct non-colour marker", marks.join(" "));
ok(getComputedStyle(document.getElementById("co-off"), "::before").content === "none",
  "callout · --mark: none opts the marker out");

// 4 · --fill reads the same set on the bar or on the piece that draws it
const w = (id) => +document.getElementById(id).getBoundingClientRect().width.toFixed(1);
ok(w("fi-out") === w("fi-in") && w("fi-out") > 0,
  "pbar · --fill works on the container and on the <i>", `${w("fi-out")}px vs ${w("fi-in")}px`);
ok(w("fi-none") === 0, "pbar · and an unset bar stays empty", `${w("fi-none")}px`);
const pb = document.getElementById("pb-out").getBoundingClientRect();
ok(cs("pb-out", "display") === "block" && Math.round(pb.width) === 200 && Math.round(pb.height) === 16,
  "pbar · a standalone bar takes the size it is given",
  `${cs("pb-out","display")} ${Math.round(pb.width)}x${Math.round(pb.height)}`);

const fails = R.filter(l=>l.startsWith("FAIL")).length;
R.unshift(`${R.length-fails}/${R.length} PASS${fails?`  —  ${fails} FAIL`:""}\n`);
document.getElementById("o").textContent = R.join("\n");
</script>

</body>
</html>
